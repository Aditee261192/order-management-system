version: '3.8'

services:

  orderdb-postgres:
    image: postgres:15
    container_name: orderdb-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network

  productdb-postgres:
    image: postgres:15
    container_name: productdb-postgres
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    networks:
      - app-network

  product-catalog-service:
    build: ./product-catalog-service
    container_name: product-catalog-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://productdb-postgres:5432/productdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PRODUCT_SERVICE_BASE_URL: http://product-catalog-service:8081
    depends_on:
      - productdb-postgres
    networks:
      - app-network

  customer-order-service:
    build: ./customer-order-service
    container_name: customer-order-service
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orderdb-postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PRODUCT_SERVICE_BASE_URL: http://product-catalog-service:8081
    depends_on:
      - orderdb-postgres
      - product-catalog-service
    networks:
      - app-network

networks:
  app-network: